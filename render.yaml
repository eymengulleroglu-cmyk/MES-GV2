services:
  # Statik frontend (mevcut yayın korunur)
  - type: web
    name: mes-g
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # API (yeni) — Render Web Service
  - type: web
    name: mes-g-api
    env: node
    rootDir: server
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mes-g-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: CORS_ORIGIN
        value: https://your-frontend-url.onrender.com
      - key: NODE_ENV
        value: production

databases:
  - name: mes-g-db
    databaseName: mesg
    user: mesg
    plan: free
